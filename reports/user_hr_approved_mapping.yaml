  - BankFlankIncipientChannel_Topo1m_converted.tif
  - BankTopEastofCanyon3_Topo1m_converted.tif
  - ChannelSurvey_700_Topo1m_UTM_utm.tif
  - HeadlessCanyon_2m.tif
  - LuciaChica1100_2m.tif                          # 1100 m: no LR coverage
  - LuciaChica2019_repeat_1100m_Topo1m_UTM_utm.tif # 1100 m: no LR coverage
  - LuciaChica2019_repeat_970m_Topo1m_UTM_utm.tif  # 1 m dup of LuciaChica970_2m
  - Transit_frmPocN_chan_cab_UTM_utm.tif           # transit line spanning multiple sites — exclude (leakage)
  # removed by user (regional composite, not an AUV patch):
  - MorroBay_all_2020_interp_32m_converted.tif
